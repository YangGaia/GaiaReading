<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' blob:; script-src 'self' 'unsafe-eval'; font-src 'self' data:; frame-src 'self' blob: data:; connect-src 'self' blob: data:;">
<title>Gaia Reading</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="fx-canvas" hidden></canvas>
  <div id="splash-view">
    <img id="splash-img" src="images/2.jpeg" alt="Gaia Reading">
    <div class="splash-name">Gaia Reading</div>
    <div class="splash-bar"><div class="splash-bar-fill"></div></div>
  </div>

  <div id="home-view" hidden>
    <div class="home-left">
      <h1 class="home-title">Gaia Reading</h1>
      <p class="home-subtitle">欢迎回来，选择要做什么</p>
      <button class="home-item d1" id="btn-home-shelf"><span class="home-ico">📚</span>进入书架</button>
      <button class="home-item d2" id="btn-home-folder"><span class="home-ico">📂</span>加载文件夹</button>
      <button class="home-item d3" id="btn-home-settings"><span class="home-ico">⚙</span>设置</button>
    </div>
    <div class="home-right">
      <img id="home-img" src="images/1.jpg" alt="Gaia Reading">
    </div>
  </div>

  <div id="library-view" hidden>
    <header class="topbar">
      <button id="btn-back-home" class="btn">← 首页</button>
      <span class="page-title">书架</span>
      <div class="actions">
        <button id="btn-settings" class="btn">设置</button>
      </div>
    </header>
    <div class="shelf-toolbar">
      <button id="btn-import-files" class="btn primary">导入文件</button>
      <button id="btn-manage" class="btn">批量管理</button>
    </div>
    <div id="manage-bar" class="manage-bar" hidden>
      <span>已选 <b id="manage-count">0</b> 本</span>
      <button id="btn-select-all" class="btn">全选</button>
      <button id="btn-remove-selected" class="btn danger">移除选中</button>
      <button id="btn-exit-manage" class="btn">完成</button>
    </div>
    <p id="library-hint" class="hint">书架为空，点击"加载文件夹"或"导入文件"添加电子书（EPUB / PDF / TXT / MOBI / AZW3）</p>
    <div id="bookshelf" class="bookshelf"></div>
  </div>

  <div id="reader-view" hidden>
    <header class="topbar">
      <button id="btn-back" class="btn">← 书架</button>
      <span id="reader-title" class="reader-title"></span>
      <div class="actions">
        <button id="btn-settings-reader" class="btn">设置</button>
      </div>
    </header>
    <div id="reader-body">
      <nav id="toc-panel" class="side-panel" hidden></nav>
      <nav id="bookmarks-panel" class="side-panel" hidden></nav>
      <div id="reader-content"></div>
    </div>
    <footer class="statusbar">
      <div id="progress-track"><div id="progress-fill"></div></div>
      <span id="reader-status"></span>
    </footer>
  </div>

  <div id="page-nav" hidden>
    <button id="btn-prev-page" class="btn">上一页</button>
    <button id="btn-next-page" class="btn">下一页</button>
  </div>

  <div id="context-menu" hidden>
    <button class="ctx-item" id="ctx-open">打开</button>
    <button class="ctx-item danger" id="ctx-remove">从书架移除</button>
  </div>

  <div id="settings-overlay" hidden>
    <div id="settings-drawer">
      <div class="drawer-head">
        <span class="drawer-title">设置</span>
        <button id="btn-settings-close" class="btn">×</button>
      </div>
      <div id="drawer-reading" hidden>
        <h3>阅读</h3>
        <div class="drawer-row">
          <button id="btn-font-minus" class="btn">A−</button>
          <span id="font-value">100%</span>
          <button id="btn-font-plus" class="btn">A+</button>
        </div>
        <div class="drawer-row">
          <button id="btn-line-height" class="btn">行距</button>
          <span id="line-height-value">1.8</span>
        </div>
        <div class="drawer-row">
          <span class="drawer-label">字体</span>
          <select id="font-select" class="drawer-select">
            <option value="default">默认</option>
            <option value="song">宋体</option>
            <option value="kai">楷体</option>
            <option value="hei">黑体</option>
            <option value="yuan">圆体</option>
          </select>
        </div>
        <div class="drawer-row" id="drawer-spread">
          <button id="btn-spread" class="btn">单页 / 双页</button>
          <span id="spread-value">单页</span>
        </div>
      </div>
      <div id="drawer-funcs" hidden>
        <h3>功能</h3>
        <button id="btn-toc" class="btn block">目录</button>
        <button id="btn-bookmarks" class="btn block">书签</button>
        <button id="btn-add-bookmark" class="btn block primary">添加书签</button>
      </div>
      <div id="drawer-appearance">
        <h3>外观</h3>
        <div class="drawer-row">
          <button id="btn-theme" class="btn">主题</button>
          <span id="theme-value">日间</span>
        </div>
      </div>
      <div class="drawer-about">
        <h3>关于</h3>
        <p>Gaia Reading 0.3.1 · 电子书阅读器</p>
      </div>
    </div>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/epub.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="paginator.js"></script>
  <script src="../shared/flow.js"></script>
  <script src="../shared/bookmarks.js"></script>
  <script src="../shared/library.js"></script>
  <script src="../shared/txt-html.js"></script>
  <script src="app.js"></script>
</body>
</html>
