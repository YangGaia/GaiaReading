<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-eval'; font-src 'self' data:; frame-src 'self' blob: data:; connect-src 'self' blob: data:;">
<title>Gaia Reading</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="library-view">
    <header class="topbar">
      <h1 class="app-title">Gaia Reading</h1>
      <div class="actions">
        <button id="btn-import-files" class="btn primary">导入文件</button>
        <button id="btn-import-folder" class="btn">导入文件夹</button>
      </div>
    </header>
    <p id="library-hint" class="hint">书架为空，点击上方按钮导入电子书（EPUB / PDF / TXT）</p>
    <div id="bookshelf" class="bookshelf"></div>
  </div>

  <div id="reader-view" hidden>
    <header class="topbar">
      <button id="btn-back" class="btn">← 书架</button>
      <span id="reader-title" class="reader-title"></span>
      <div class="actions">
        <button id="btn-font-minus" class="btn" title="字号减小">A−</button>
        <button id="btn-font-plus" class="btn" title="字号增大">A+</button>
        <button id="btn-line-height" class="btn" title="切换行距">行距</button>
        <button id="btn-toc" class="btn" title="目录">目录</button>
        <button id="btn-bookmarks" class="btn" title="书签">书签</button>
        <button id="btn-add-bookmark" class="btn primary" title="添加书签">+书签</button>
      </div>
    </header>
    <div id="reader-body">
      <nav id="toc-panel" class="side-panel" hidden></nav>
      <nav id="bookmarks-panel" class="side-panel" hidden></nav>
      <div id="reader-content"></div>
    </div>
    <footer id="reader-status" class="statusbar"></footer>
  </div>

  <div id="page-nav" hidden>
    <button id="btn-prev-page" class="btn">上一页</button>
    <button id="btn-next-page" class="btn">下一页</button>
  </div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/epub.min.js"></script>
  <script src="vendor/pdf.min.js"></script>
  <script src="../shared/bookmarks.js"></script>
  <script src="../shared/library.js"></script>
  <script src="app.js"></script>
</body>
</html>
